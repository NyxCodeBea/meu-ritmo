<html lang="pt-BR">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Meu Ritmo</title>
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Meu Ritmo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FCEFF1; --soft:#F7D7DE; --line:#F3D6DC; --card:#FFFFFF;
  --ink:#2A1F2D; --muted:#6E6170; --primary:#B44C66; --primary-ink:#A03D57; --accent:#E39AAA;
  --m:#B8475F; --m-ink:#963249; --m-soft:#F6E2E6;
  --f:#C8693A; --f-ink:#9A4A22; --f-soft:#F8E6DA;
  --o:#A87A12; --o-ink:#7E5A08; --o-soft:#F6EBCB;
  --l:#7C5FAE; --l-ink:#5E4689; --l-soft:#ECE4F6;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 'DM Sans',system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.app{max-width:440px;margin:0 auto;min-height:100vh;padding:calc(env(safe-area-inset-top) + 20px) 20px calc(env(safe-area-inset-bottom) + 110px);position:relative}
.serif{font-family:Fraunces,Georgia,serif;font-weight:500}
.kicker{font-size:12px;font-weight:700;letter-spacing:.13em;text-transform:uppercase}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.card{background:var(--card);border-radius:22px;padding:16px}
h1,h2,h3{margin:0}
.h1{font-size:28px;line-height:1.12}
.listrow{display:flex;align-items:center;gap:14px;width:100%;min-height:60px;padding:10px 16px;border:0;background:none;position:relative;font:inherit;color:inherit;text-align:left}
.listrow + .listrow{border-top:1px solid var(--line)}
.listrow[aria-disabled=true]{opacity:.7}
.lic{width:36px;height:36px;border-radius:12px;background:var(--soft);color:var(--primary-ink);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.lic svg{width:19px;height:19px}
.lt{display:block;font-size:15px;font-weight:600}
.ls{display:block;font-size:12.5px;color:var(--muted);margin-top:1px}
.tag{font-size:11px;font-weight:700;padding:4px 9px;border-radius:10px;background:var(--soft);color:var(--primary-ink);white-space:nowrap}
.sw{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;flex-shrink:0;cursor:pointer;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:12px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .2s}
.sw:checked{background:var(--primary)}.sw:checked::after{left:23px}
.sw:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{padding:14px 10px;text-align:center;display:flex;flex-direction:column;gap:2px}
.stat b{font-size:26px;font-weight:600;color:var(--primary-ink)}.stat span{font-size:11.5px;color:var(--muted);line-height:1.25}
.premium{border-radius:24px;padding:18px;color:#fff;background:linear-gradient(135deg,#B44C66,#D9788F)}
.filtros{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.filtros .chip{padding:0 4px;font-size:13.5px;min-height:40px;white-space:nowrap}
.fit{white-space:nowrap;overflow:hidden;text-overflow:clip;min-width:0}
.h2{font-size:21px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}.mt24{margin-top:24px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;width:100%;border-radius:26px;border:0;background:var(--primary);color:#fff;font-weight:600;font-size:16px;padding:0 20px}
.btn.ghost{background:#fff;color:var(--primary-ink);border:1.5px solid var(--accent)}
.btn:disabled{opacity:.45}
.chip{min-height:42px;padding:0 16px;border-radius:21px;border:1.5px solid var(--line);background:#fff;font-size:14px;font-weight:500}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.input{min-height:50px;border-radius:16px;border:1.5px solid var(--line);background:#fff;padding:0 14px;font-size:16px;width:100%}
input[type=date].input{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;text-align:left;line-height:50px;color:var(--ink)}
input[type=date].input::-webkit-date-and-time-value{text-align:left}
.input:focus,.chip:focus-visible,.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.icon{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.iconbtn{width:44px;height:44px;border-radius:22px;border:0;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--ink);box-shadow:0 1px 3px rgba(42,31,45,.08)}
nav.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 14px);width:min(408px,calc(100% - 32px));height:66px;border-radius:33px;background:#fff;box-shadow:0 6px 24px rgba(42,31,45,.12);display:grid;grid-template-columns:repeat(4,1fr);z-index:10}
nav.tabs[hidden]{display:none}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:500;color:var(--muted)}
nav.tabs button.on{color:var(--primary-ink);font-weight:700}
.phasecard{border-radius:28px;padding:22px;color:#fff;display:flex;flex-direction:column;gap:14px}
.bars{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.bars span{height:8px;border-radius:4px;background:rgba(255,255,255,.32)}
.bars span.on{background:#fff}
.ring{position:relative;width:96px;height:96px;flex-shrink:0}
.ring svg{width:96px;height:96px;transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.tl{position:relative;margin:18px 6px 0}
.tl .track{height:4px;border-radius:2px;background:var(--line)}
.tl .fill{position:absolute;left:0;top:0;height:4px;border-radius:2px;background:var(--accent)}
.tl .pt{position:absolute;top:-5px;width:14px;height:14px;border-radius:7px;margin-left:-7px;border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.tl .now{position:absolute;top:-9px;width:22px;height:22px;border-radius:11px;margin-left:-11px;background:var(--ink);border:3px solid #fff}
.tlabels{display:grid;grid-template-columns:1fr 1fr 1fr;margin-top:16px;font-size:12px}
.tlabels div:nth-child(2){text-align:center}.tlabels div:nth-child(3){text-align:right}
.tlabels b{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.streak{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px}
.streak div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--muted);font-weight:500}
.streak span{width:36px;height:36px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;border:1.5px solid var(--line);background:#fff;color:var(--ink)}
.streak span.on{background:var(--primary);border-color:var(--primary);color:#fff}
.streak span.hj{border-color:var(--primary);border-style:dashed}
.sug{background:#fff;border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:8px;min-height:108px}
.sug .ic{width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.sug .ic svg{width:17px;height:17px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.week div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:500;color:var(--muted)}
.dot{width:38px;height:38px;border-radius:19px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,1fr);row-gap:12px}
.cal .wd{text-align:center;font-size:11px;font-weight:600;color:var(--muted)}
.cal button{justify-self:center;width:40px;height:40px;border-radius:20px;border:2px solid transparent;font-size:14px;font-weight:600;position:relative;padding:0}
.cal button .gota{position:absolute;top:-5px;right:-3px;width:15px;height:15px;color:var(--m)}
.cal button small{position:absolute;right:-2px;bottom:-4px;font-size:9px;font-weight:600;color:var(--muted);background:#fff;border-radius:6px;padding:0 2px;line-height:12px}
.cal button .reg{position:absolute;bottom:3px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:2px;background:currentColor}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;font-size:13px;color:#4A3E4C}
.legend span{display:inline-block;width:14px;height:14px;border-radius:7px;vertical-align:-2px;margin-right:8px}
.seg{display:grid;gap:8px}
.energy button{min-height:58px;border-radius:16px;border:1.5px solid var(--line);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:600}
.energy button b{font-family:Fraunces,serif;font-size:18px;font-weight:600}
.energy button.on{background:var(--primary);border-color:var(--primary);color:#fff}
.article{background:var(--ink);color:#fff;border-radius:26px;padding:22px}
.article p{color:#E8DEE6;font-size:15px;line-height:1.55}
.listitem{display:flex;gap:14px;align-items:center;background:#fff;border-radius:20px;padding:14px;width:100%;border:0;text-align:left}
.sheet{position:fixed;inset:0;background:rgba(42,31,45,.35);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet .in{background:var(--bg);width:min(440px,100%);max-height:88vh;overflow:auto;border-radius:28px 28px 0 0;padding:22px 20px calc(env(safe-area-inset-bottom) + 24px)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 96px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;z-index:30}
.note{font-size:12.5px;color:var(--muted);line-height:1.5}
.pbar{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px}
.statrow{display:grid;grid-template-columns:90px 1fr 34px;gap:10px;align-items:center;font-size:13px}
.statrow .track{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.statrow .track i{display:block;height:100%;border-radius:5px}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--primary)}
</style>

/* =========================================================

// ---------- Armazenamento ----------
const KEY = 'meuritmo.v1';
const store = {
  load() { try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch (e) { return null; } },
  save(d) { try { localStorage.setItem(KEY, JSON.stringify(d)); return true; } catch (e) { return false; } },
  clear() { try { localStorage.removeItem(KEY); } catch (e) {} }
};
let data = store.load() || { perfil: null, registros: {}, inicios: [] };
function persist() { if (!store.save(data)) toast('Não consegui salvar neste navegador.'); }

// ---------- Datas ----------
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const diasEntre = (a, b) => Math.round((Date.UTC(b.getFullYear(), b.getMonth(), b.getDate()) - Date.UTC(a.getFullYear(), a.getMonth(), a.getDate())) / 86400000);
const addDias = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const hoje = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const SEM = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const SEM_LONGO = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
const dataLonga = d => SEM_LONGO[d.getDay()] + ', ' + d.getDate() + ' de ' + MESES[d.getMonth()];
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// ---------- Lógica do ciclo ----------
// Duração média: usa os inícios registrados (se houver 2+), senão a informada no cadastro.
function duracaoCiclo() {
  const ini = [...data.inicios].sort();
  if (ini.length >= 2 && (!data.perfil.prefs || data.perfil.prefs.media !== false)) {
    const gaps = [];
    for (let i = 1; i < ini.length; i++) { const g = diasEntre(parse(ini[i - 1]), parse(ini[i])); if (g >= 18 && g <= 45) gaps.push(g); }
    const ult = gaps.slice(-6);
    if (ult.length) return Math.round(ult.reduce((a, b) => a + b, 0) / ult.length);
  }
  return data.perfil.ciclo;
}
function ultimoInicio(ate) {
  const ini = [...data.inicios].sort().filter(s => parse(s) <= ate);
  return ini.length ? parse(ini[ini.length - 1]) : null;
}
// Retorna { dia, fase, ciclo, previsto } para uma data
function infoDia(d) {
  const ciclo = duracaoCiclo();
  const menstr = data.perfil.menstruacao;
  let base = ultimoInicio(d);
  let previsto = false;
  if (!base) { // data anterior ao primeiro registro: projeta para trás
    const primeiro = parse([...data.inicios].sort()[0]);
    const n = Math.ceil(diasEntre(d, primeiro) / ciclo);
    base = addDias(primeiro, -n * ciclo); previsto = true;
  }
  let dia = diasEntre(base, d) + 1;
  if (dia > ciclo) { previsto = true; dia = ((dia - 1) % ciclo) + 1; }
  const ovu = Math.max(menstr + 3, ciclo - 14);
  let fase;
  if (dia <= menstr) fase = 'm';
  else if (dia < ovu - 1) fase = 'f';
  else if (dia <= ovu + 1) fase = 'o';
  else fase = 'l';
  return { dia, fase, ciclo, previsto, ovu };
}
function proximaMenstruacao(d) {
  const ciclo = duracaoCiclo();
  const base = ultimoInicio(d) || parse(data.inicios[0]);
  let prox = addDias(base, ciclo);
  while (prox <= d) prox = addDias(prox, ciclo);
  return prox;
}
function diasAteProximaFase(d) {
  const atual = infoDia(d).fase;
  for (let i = 1; i <= 40; i++) { const f = infoDia(addDias(d, i)).fase; if (f !== atual) return { dias: i, fase: f }; }
  return null;
}

};
const RECEITAS = {

// ---------- Ícones ----------

// ---------- Estado da interface ----------
let tela = 'hoje';
let calMes = (() => { const d = hoje(); return new Date(d.getFullYear(), d.getMonth(), 1); })();
let calSel = iso(hoje());
let onb = { passo: 0, nome: '', inicio: '', anterior: '', ciclo: 28, menstruacao: 5, objetivos: [] };
let conteudoFase = null;

const $app = document.getElementById('app');
const $tabs = document.getElementById('tabs');
const $ov = document.getElementById('overlay');

function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2200);
}
const corFase = f => ({ cor: `var(--${f})`, ink: `var(--${f}-ink)`, soft: `var(--${f}-soft)` });

// ---------- Cadastro ----------
function renderOnboarding() {
  setTimeout(() => ajustarTitulos(), 0);
  $tabs.hidden = true;
  const p = onb.passo, total = 4;
  const steps = `<div class="steps" aria-hidden="true">${Array.from({ length: total }, (_, i) => `<i class="${i <= p ? 'on' : ''}"></i>`).join('')}</div>`;
  let corpo = '', pode = true;
  if (p === 0) {
    corpo = `<div style="display:flex;flex-direction:column;align-items:flex-start;gap:16px;margin-top:40px">
      ${logo(72)}
      <h1 class="serif h1 fit" style="font-size:34px;width:100%">Seu ciclo, seu ritmo.</h1>
      <p class="muted" style="margin:0;font-size:16px">Um app que entende que você não é igual todo dia. Descubra sua fase e receba sugestões para treino, comida, trabalho e autocuidado.</p>
      <div class="field" style="width:100%;margin-top:12px"><label for="nome">Como você quer ser chamada?</label>
      <input class="input" id="nome" autocomplete="given-name" value="${esc(onb.nome)}" placeholder="Seu nome"></div></div>`;
    pode = onb.nome.trim().length > 0;
  } else if (p === 1) {
    corpo = `<h1 class="serif h1 mt24 fit">Sua última menstruação</h1>
      <p class="muted">O primeiro dia do sangramento. Se não lembrar exato, uma data aproximada já ajuda.</p>
      <div class="field mt16"><label for="ini">Primeiro dia</label><input class="input" type="date" id="ini" max="${iso(hoje())}" value="${onb.inicio}"></div>
      <div class="field mt16"><label for="ant">E a menstruação anterior? (opcional)</label><input class="input" type="date" id="ant" max="${onb.inicio || iso(hoje())}" value="${onb.anterior}"></div>
      <p class="note mt8">Com as duas datas, o app já calcula o tamanho do seu ciclo. Se usa outro app de menstruação, as datas estão lá.</p>`;
    pode = !!onb.inicio;
  } else if (p === 2) {
    corpo = `<h1 class="serif h1 mt24 fit">Como é o seu ciclo?</h1>
      <p class="muted">${onb.anterior ? 'Calculamos pelo intervalo entre as duas datas que você informou. Ajuste se quiser.' : 'Não sabe? Deixe como está. O app ajusta sozinho conforme você registra.'}</p>
      <div class="field mt16"><label for="ciclo">Duração do ciclo (dias)</label><input class="input" type="number" inputmode="numeric" min="18" max="45" id="ciclo" value="${onb.ciclo}"></div>
      <div class="field mt12"><label for="menstr">Duração da menstruação (dias)</label><input class="input" type="number" inputmode="numeric" min="2" max="10" id="menstr" value="${onb.menstruacao}"></div>`;
    pode = onb.ciclo >= 18 && onb.ciclo <= 45 && onb.menstruacao >= 2 && onb.menstruacao <= 10;
  } else {
    corpo = `<h1 class="serif h1 mt24 fit">O que você busca?</h1>
      <p class="muted">Escolha quantos quiser. Isso define o que aparece primeiro no seu dia.</p>
      <div class="chips mt16">${OBJETIVOS.map(o => `<button type="button" class="chip ${onb.objetivos.includes(o.id) ? 'on' : ''}" data-obj="${o.id}" aria-pressed="${onb.objetivos.includes(o.id)}">${o.t}</button>`).join('')}</div>
      <p class="note mt24">O Meu Ritmo é uma ferramenta de autoconhecimento. Não faz diagnóstico, não substitui acompanhamento médico e não é método contraceptivo. Seus dados ficam só neste aparelho.</p>`;
  }
  $app.innerHTML = `${steps}${corpo}
    <div style="display:flex;gap:10px;margin-top:28px">
      ${p > 0 ? `<button class="btn ghost" style="width:auto;min-width:100px" id="voltar">Voltar</button>` : ''}
      <button class="btn" id="seguir" ${pode ? '' : 'disabled'}>${p === total - 1 ? 'Começar' : 'Continuar'}</button>
    </div>`;
  const on = (id, ev, fn) => { const el = document.getElementById(id); if (el) el.addEventListener(ev, fn); };
  on('nome', 'input', e => { onb.nome = e.target.value; document.getElementById('seguir').disabled = !onb.nome.trim(); });
  on('ini', 'change', e => { onb.inicio = e.target.value; renderOnboarding(); });
  on('ant', 'change', e => { onb.anterior = e.target.value; renderOnboarding(); });
  on('ciclo', 'change', e => { onb.ciclo = Number(e.target.value); renderOnboarding(); });
  on('menstr', 'change', e => { onb.menstruacao = Number(e.target.value); renderOnboarding(); });
  $app.querySelectorAll('[data-obj]').forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.obj; onb.objetivos = onb.objetivos.includes(id) ? onb.objetivos.filter(x => x !== id) : [...onb.objetivos, id]; renderOnboarding();
  }));
  on('voltar', 'click', () => { onb.passo--; renderOnboarding(); });
  on('seguir', 'click', () => {
    if (onb.passo === 1 && onb.anterior) {
      const g = diasEntre(parse(onb.anterior), parse(onb.inicio));
      if (g < 18 || g > 45) { toast('As duas datas precisam ter entre 18 e 45 dias de distância.'); return; }
      onb.ciclo = g;
    }
    if (onb.passo < total - 1) { onb.passo++; renderOnboarding(); return; }
    if (parse(onb.inicio) > hoje()) { toast('A data não pode ser no futuro.'); return; }
    data = { perfil: { nome: onb.nome.trim(), ciclo: onb.ciclo, menstruacao: onb.menstruacao, objetivos: onb.objetivos, criadoEm: iso(hoje()) }, registros: {}, inicios: onb.anterior ? [onb.anterior, onb.inicio] : [onb.inicio] };
    persist(); tela = 'hoje'; render();
  });
}

// ---------- Hoje ----------
function ordemCategorias() {
  const obj = data.perfil.objetivos.filter(o => CAT[o]);
  return [...obj, ...Object.keys(CAT).filter(c => !obj.includes(c))];
}
function renderHoje() {
  const d = hoje(), info = infoDia(d), F = FASES[info.fase], c = corFase(info.fase);
  const prox = diasAteProximaFase(d);
  const proxTxt = prox ? (prox.fase === 'm' ? `Menstruação prevista em cerca de ${prox.dias} ${prox.dias === 1 ? 'dia' : 'dias'}` : `Fase ${FASES[prox.fase].nome} em cerca de ${prox.dias} ${prox.dias === 1 ? 'dia' : 'dias'}`) : '';
  const semIni = addDias(d, -d.getDay());
  const semana = Array.from({ length: 7 }, (_, i) => {
    const di = addDias(semIni, i), f = infoDia(di).fase, cc = corFase(f), eh = i === d.getDay();
    return `<div>${SEM[i]}<span class="dot" style="background:${eh ? 'var(--ink)' : cc.soft};color:${eh ? '#fff' : cc.ink}">${di.getDate()}</span></div>`;
  }).join('');
  const seed = diasEntre(new Date(2024, 0, 1), d);
  const cards = ordemCategorias().map(cat => {
    const lista = SUGESTOES[info.fase][cat], t = lista[seed % lista.length];
    return `<div class="sug"><div class="row" style="justify-content:flex-start;gap:8px"><span class="ic" style="background:${c.soft};color:${c.ink}">${ico(CAT[cat].path)}</span>
      <span class="kicker muted" style="font-size:11.5px;letter-spacing:.06em">${CAT[cat].t}</span></div>
      <span style="font-size:14px;font-weight:500;line-height:1.35">${t}</span></div>`;
  }).join('');
  const reg = data.registros[iso(d)];
  $app.innerHTML = `
    <div class="row"><div style="flex:1;min-width:0"><div class="muted" style="font-size:13px">${dataLonga(d)}</div>
      <h1 class="serif fit" style="font-size:26px">${saudacao()}, ${esc(data.perfil.nome.split(/\s+/)[0])}</h1></div>${logo()}</div>
    <div class="week mt16">${semana}</div>
    <div class="phasecard mt20" style="background:${c.cor}">
      <div class="row" style="align-items:center;justify-content:flex-start;gap:16px">
        <div class="ring" role="img" aria-label="Dia ${info.dia} de ${info.ciclo} do ciclo">
          <svg viewBox="0 0 96 96" aria-hidden="true"><circle cx="48" cy="48" r="42" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="7"/>
          <circle cx="48" cy="48" r="42" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-dasharray="${(2 * Math.PI * 42 * Math.min(info.dia, info.ciclo) / info.ciclo).toFixed(1)} 999"/></svg>
          <div class="in"><span style="font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.92">Dia</span><span class="serif" style="font-size:34px;font-weight:600">${info.dia}</span><span style="font-size:11px;opacity:.92">de ${info.ciclo}</span></div>
        </div>
        <div style="flex:1;min-width:0"><div class="kicker" style="opacity:.92">Fase ${F.nome}</div><div class="serif fit" style="font-size:24px;line-height:1.15;margin-top:4px">${F.frase}</div></div>
      </div>
      <div><div class="row" style="font-size:13px;font-weight:500"><span>Energia esperada</span><span>${['', 'Baixa', 'Moderada', 'Boa', 'Alta'][F.energia]}</span></div>
      <div class="bars mt8">${[1, 2, 3, 4].map(n => `<span class="${n <= F.energia ? 'on' : ''}"></span>`).join('')}</div></div>
      ${prox && prox.fase !== 'm' ? `<div style="font-size:13px;font-weight:500">${proxTxt}</div>` : ''}
    </div>
    ${linhaDoTempo(d, info)}
    ${info.previsto ? `<p class="note mt8">Sua menstruação passou da data prevista. Se ela já começou, marque abaixo para o app se ajustar.</p>` : ''}
    <div class="row mt24"><h2 class="serif h2">Seu dia de hoje</h2><button class="chip" style="min-height:36px;border:0;background:none;color:var(--primary-ink);font-weight:600;padding:0" id="vermais">Ver mais</button></div>
    <div class="grid2 mt12">${cards}</div>
    ${sequencia(d)}
    <button class="btn mt16" id="registrar">${reg ? ico(I.check) + ' Registro de hoje feito · editar' : ico(I.mais) + ' Como você está hoje?'}</button>
    <button class="btn ghost mt12" id="menstruou">${ico(I.gota)} Minha menstruação começou hoje</button>`;
  document.getElementById('registrar').onclick = () => abrirRegistro(iso(d));
  document.getElementById('vermais').onclick = () => { conteudoFase = info.fase; ir('conteudo'); };
  document.getElementById('menstruou').onclick = () => marcarInicio(iso(d));
}
const curta = d => d.getDate() + ' ' + MESES[d.getMonth()].slice(0, 3);
function linhaDoTempo(d, info) {
  const ini = ultimoInicio(d) || addDias(d, -(info.dia - 1));
  const ovu = addDias(ini, info.ovu - 1);
  const prox = proximaMenstruacao(d);
  const pos = Math.min(100, Math.max(0, (info.dia - 1) / (info.ciclo - 1) * 100));
  const posOvu = (info.ovu - 1) / (info.ciclo - 1) * 100;
  const faltam = diasEntre(d, prox);
  return `<div class="card mt12">
    <div class="row"><span style="font-size:14px;font-weight:600">${faltam <= 0 ? 'Menstruação prevista para hoje' : faltam === 1 ? 'Falta 1 dia para a menstruação' : 'Faltam ' + faltam + ' dias para a menstruação'}</span></div>
    <div class="tl" aria-hidden="true"><div class="track"></div><div class="fill" style="width:${pos}%"></div>
      <span class="pt" style="left:0;background:var(--m)"></span><span class="pt" style="left:${posOvu}%;background:var(--o)"></span><span class="pt" style="left:100%;background:#fff;box-shadow:0 0 0 2px var(--m)"></span>
      <span class="now" style="left:${pos}%"></span></div>
    <div class="tlabels"><div><b>Última</b>${curta(ini)}</div><div><b>Ovulação</b>${curta(ovu)}</div><div><b>Próxima</b>${curta(prox)}</div></div>
  </div>`;
}
function sequencia(d) {
  let n = 0, x = data.registros[iso(d)] ? d : addDias(d, -1);
  while (data.registros[iso(x)]) { n++; x = addDias(x, -1); }
  const dias = Array.from({ length: 7 }, (_, i) => addDias(d, i - 6));
  return `<div class="card mt16"><div class="row"><span class="serif" style="font-size:19px">Sua sequência</span>
    <span style="font-size:13px;font-weight:600;color:var(--primary-ink)">${n === 0 ? 'Comece hoje' : n + (n === 1 ? ' dia seguido' : ' dias seguidos')}</span></div>
    <div class="streak">${dias.map(di => { const on = !!data.registros[iso(di)], hj = iso(di) === iso(d);
      return `<div>${SEM[di.getDay()]}<span class="${on ? 'on' : ''} ${hj && !on ? 'hj' : ''}" aria-label="${di.getDate()}: ${on ? 'registrado' : 'sem registro'}">${on ? ico(I.check, 'style="width:16px;height:16px"') : di.getDate()}</span></div>`; }).join('')}</div>
    <p class="note" style="margin:10px 0 0">Registrar todo dia, nem que seja só a energia, é o que faz o app aprender o seu padrão.</p></div>`;
}
function saudacao() { const h = new Date().getHours(); return h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite'; }
function marcarInicio(dia) {
  if (data.inicios.includes(dia)) { toast('Esse dia já está marcado como início.'); return; }
  const prox = data.inicios.filter(s => Math.abs(diasEntre(parse(s), parse(dia))) < 10);
  if (prox.length) data.inicios = data.inicios.filter(s => !prox.includes(s)); // corrige um início próximo
  data.inicios.push(dia); data.inicios.sort();
  const r = data.registros[dia] || {}; if (!r.fluxo || r.fluxo === 'Nenhum') r.fluxo = 'Moderado'; data.registros[dia] = r;
  persist(); toast('Ciclo atualizado.'); render();
}

// ---------- Registro ----------
function abrirRegistro(dia) {
  const atual = data.registros[dia] || {};
  const r = { energia: atual.energia || 0, humor: [...(atual.humor || [])], sintomas: [...(atual.sintomas || [])], sono: atual.sono || '', fluxo: atual.fluxo || '' };
  const d = parse(dia), info = infoDia(d), c = corFase(info.fase);
  const draw = () => {
    const chips = (lista, sel, grupo) => lista.map(t => `<button type="button" class="chip ${sel.includes(t) ? 'on' : ''}" data-g="${grupo}" data-v="${t}" aria-pressed="${sel.includes(t)}">${t}</button>`).join('');
    const um = (lista, v, grupo, cols) => `<div class="seg" style="grid-template-columns:repeat(${cols},1fr)">${lista.map(t => `<button type="button" class="chip ${v === t ? 'on' : ''}" data-u="${grupo}" data-v="${t}" aria-pressed="${v === t}" style="padding:0 6px">${t}</button>`).join('')}</div>`;
    $ov.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="regtit"><div class="in">
      <div class="row"><span class="kicker" style="color:${c.ink}">Dia ${info.dia} · ${FASES[info.fase].titulo}</span>
      <button class="iconbtn" id="fechar" aria-label="Fechar">${ico(I.x)}</button></div>
      <h2 class="serif h1 mt8 fit" id="regtit">${dia === iso(hoje()) ? 'Como você está hoje?' : 'Registro de ' + d.getDate() + ' de ' + MESES[d.getMonth()]}</h2>
      <div class="kicker muted mt20" style="font-size:12px">Energia</div>
      <div class="seg energy mt8" style="grid-template-columns:repeat(5,1fr)">${ENERGIAS.map((e, i) => `<button type="button" class="${r.energia === i + 1 ? 'on' : ''}" data-e="${i + 1}" aria-pressed="${r.energia === i + 1}"><b>${i + 1}</b>${e}</button>`).join('')}</div>
      <div class="kicker muted mt20" style="font-size:12px">Humor</div><div class="chips mt8">${chips(HUMORES, r.humor, 'humor')}</div>
      <div class="kicker muted mt20" style="font-size:12px">Sintomas</div><div class="chips mt8">${chips(SINTOMAS, r.sintomas, 'sintomas')}</div>
      <div class="kicker muted mt20" style="font-size:12px">Sono</div><div class="mt8">${um(SONOS, r.sono, 'sono', 3)}</div>
      <div class="kicker muted mt20" style="font-size:12px">Fluxo</div><div class="mt8">${um(FLUXOS, r.fluxo, 'fluxo', 4)}</div>

    <div class="card mt20"><h2 class="serif h2 fit">Onde ficam seus dados</h2>
      <p class="muted" style="font-size:14px;margin-bottom:0">Tudo fica guardado só neste aparelho. Nada é enviado para a internet. Por isso, salve uma cópia de vez em quando: se você trocar de celular ou apagar o app, é ela que traz seus registros de volta.</p></div>
    <div class="card mt16" style="padding:4px 0">
      <button type="button" class="listrow" id="exportar"><span class="lic">${ico(IV.baixar)}</span><span style="flex:1;text-align:left"><span class="lt">Salvar uma cópia</span><span class="ls">Baixa um arquivo com todos os seus registros</span></span></button>
      <label class="listrow" style="cursor:pointer"><span class="lic">${ico(IV.subir)}</span><span style="flex:1"><span class="lt">Restaurar uma cópia</span><span class="ls">Escolha o arquivo salvo antes</span></span><input type="file" id="importar" accept=".json,application/json" style="position:absolute;opacity:0;width:1px;height:1px"></label>
    </div>
    <button class="btn ghost mt16" id="apagar" style="color:#8E2F45">${ico(IV.lixo)} Apagar todos os meus dados</button>`;
  ligarVoltar();
  document.getElementById('exportar').onclick = () => {
    const blob = new Blob([JSON.stringify({ app: 'meu-ritmo', versao: 1, salvoEm: new Date().toISOString(), dados: data }, null, 2)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'meu-ritmo-backup-' + iso(hoje()) + '.json';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  };
  document.getElementById('importar').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const j = JSON.parse(await f.text());
      const d = j.dados || j;
      if (!d.perfil || !Array.isArray(d.inicios) || typeof d.registros !== 'object') throw new Error();
      confirmarRestaurar(d);
    } catch (err) { toast('Esse arquivo não é uma cópia do Meu Ritmo.'); }
  };
  document.getElementById('apagar').onclick = () => confirmarApagar();
}
function confirmarRestaurar(d) {
  $ov.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="rtit"><div class="in">
    <h2 class="serif h1 fit" id="rtit">Restaurar cópia?</h2>
    <p class="muted">Os dados atuais deste aparelho serão trocados pelos da cópia: ${d.inicios.length} ${d.inicios.length === 1 ? 'ciclo' : 'ciclos'} e ${Object.keys(d.registros).length} dias registrados.</p>
    <button class="btn mt16" id="rsim">Restaurar</button><button class="btn ghost mt12" id="rnao">Cancelar</button></div></div>`;
  document.getElementById('rnao').onclick = fecharSheet;
  document.getElementById('rsim').onclick = () => { data = d; persist(); fecharSheet(); voceSub = null; toast('Cópia restaurada.'); render(); };
}
function subSobre() {
  $app.innerHTML = `${voltarTopo('Sobre')}
    <div class="card mt20" style="display:flex;align-items:center;gap:14px">${logo(56)}<div><div class="serif" style="font-size:22px">Meu Ritmo</div><div class="muted" style="font-size:13px">Seu ciclo, seu ritmo. · ${VERSAO}</div></div></div>
    <div class="card mt16"><h2 class="serif h2 fit">Aviso de saúde</h2>
      <p class="muted" style="font-size:14px">O Meu Ritmo é uma ferramenta de autoconhecimento e não substitui acompanhamento médico. Procure uma profissional se tiver dor forte, sangramento fora do padrão ou ciclos muito irregulares.</p>
      <p class="muted" style="font-size:14px;margin-bottom:0">As previsões são estimativas. Não use o app como método contraceptivo nem para planejar gravidez.</p></div>
    <div class="card mt16"><h2 class="serif h2 fit">Privacidade</h2>
      <p class="muted" style="font-size:14px;margin-bottom:0">Seus registros ficam só neste aparelho. O Meu Ritmo não tem anúncios e não vende dados.</p></div>`;
  ligarVoltar();
}
function confirmarApagar() {
  $ov.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="aptit"><div class="in">
    <h2 class="serif h1 fit" id="aptit">Apagar tudo?</h2>
    <p class="muted">Seus registros, ciclos e perfil serão apagados deste aparelho. Isso não pode ser desfeito.</p>
    <button class="btn mt16" id="sim" style="background:#8E2F45">Sim, apagar tudo</button>
    <button class="btn ghost mt12" id="nao">Cancelar</button></div></div>`;
  document.getElementById('nao').onclick = fecharSheet;
  document.getElementById('sim').onclick = () => {
    store.clear(); data = { perfil: null, registros: {}, inicios: [] };
    onb = { passo: 0, nome: '', inicio: '', anterior: '', ciclo: 28, menstruacao: 5, objetivos: [] };
    fecharSheet(); render();
  };
}

// ---------- Títulos sempre em uma linha ----------
function ajustarTitulos(raiz = document) {
  raiz.querySelectorAll('.fit').forEach(el => {
    el.style.fontSize = '';
    let t = parseFloat(getComputedStyle(el).fontSize);
    while (el.scrollWidth > el.clientWidth + 1 && t > 14) { t -= 1; el.style.fontSize = t + 'px'; }
  });
}
window.addEventListener('resize', () => ajustarTitulos());
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => ajustarTitulos());
new MutationObserver(() => ajustarTitulos()).observe(document.getElementById('overlay'), { childList: true });

// ---------- Navegação ----------
const TABS = [['hoje', 'Hoje', I.sol], ['calendario', 'Calendário', I.cal], ['conteudo', 'Conteúdo', I.livro], ['voce', 'Você', I.user]];
function ir(t) { if (t !== 'voce' || tela === 'voce') voceSub = null; tela = t; if (t !== 'conteudo') conteudoFase = null; render(); window.scrollTo(0, 0); }
function renderTabs() {
  $tabs.hidden = false;
  $tabs.innerHTML = TABS.map(([id, t, p]) => `<button type="button" class="${tela === id ? 'on' : ''}" data-t="${id}" ${tela === id ? 'aria-current="page"' : ''}>${ico(p)}${t}</button>`).join('');
  $tabs.querySelectorAll('[data-t]').forEach(b => b.onclick = () => ir(b.dataset.t));
}
function render() {
  if (!data.perfil) { renderOnboarding(); return; }
  renderTabs();
  ({ hoje: renderHoje, calendario: renderCalendario, conteudo: renderConteudo, voce: renderVoce })[tela]();
  ajustarTitulos();
}
render();
</script>
</body>
